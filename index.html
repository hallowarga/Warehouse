<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f9afe">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gudang Masuk Keluar</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--tx:#1d2a26;--mut:#68736f;--pri:#0f6b5a;--ptx:#fff;--bd:#dcd8cf;--ok:#1d7a46;--warn:#a86400;--bad:#b3261e;--in:#e1f1ea;--out:#fbe6e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a18;--card:#1b2623;--tx:#e8efec;--mut:#98a6a1;--pri:#3fbf9f;--ptx:#08201a;--bd:#2c3b37;--ok:#5fd08d;--warn:#e3a33b;--bad:#ff8a80;--in:#1c3a31;--out:#442522;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a18;--card:#1b2623;--tx:#e8efec;--mut:#98a6a1;--pri:#3fbf9f;--ptx:#08201a;--bd:#2c3b37;--ok:#5fd08d;--warn:#e3a33b;--bad:#ff8a80;--in:#1c3a31;--out:#442522;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 14px}
h2{font:700 16px Georgia,serif;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.stats b{display:block;font-size:22px}.stats span{color:var(--mut);font-size:12px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
label small{font-weight:400;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--pri);color:var(--ptx);font:700 15px inherit;cursor:pointer}
.btn.out{background:var(--bad);color:#fff}.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mut);font:600 12px inherit;cursor:pointer}
nav button[aria-current=true]{color:var(--pri);box-shadow:inset 0 3px var(--pri)}
.item{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.item small,.mut{color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;border:1px solid currentColor;margin-right:4px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.qty{text-align:right;font-weight:700;white-space:nowrap}
.mv{border-left:4px solid var(--ok);background:var(--in)}.mv.o{border-left-color:var(--bad);background:var(--out)}
.prev{margin-top:8px;max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--bd)}
.up{display:block;padding:12px;border:2px dashed var(--bd);border-radius:10px;text-align:center;color:var(--mut);cursor:pointer;margin:0}
.up.has{border-style:solid;border-color:var(--ok);color:var(--ok)}
.up input{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:9}
#modal.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;display:none;z-index:10}
iframe{width:100%;height:280px;border:1px solid var(--bd);border-radius:8px;margin-top:8px}
.rb{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mut)}
.rb button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 12px;font-weight:600;font-size:12px;cursor:pointer}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let db={batches:[],moves:[]},tab='stok',q='',pend={};
let role='petugas';
function defaults(){db.loads=db.loads||[];db.vtypes=db.vtypes||['Pickup','Blind van','Truk engkel','Truk box','Truk chiller','Fuso','Kontainer'];db.pins=db.pins||{admin:'2222',superadmin:'1111'}}
defaults();
const IDB={open(){return new Promise((res,rej)=>{const r=indexedDB.open('wms',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},async get(){const d=await this.open();return new Promise((res,rej)=>{const g=d.transaction('kv').objectStore('kv').get('db');g.onsuccess=()=>res(g.result);g.onerror=()=>rej(g.error)})},async set(v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,'db');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
function save(){IDB.set(db).catch(()=>{try{localStorage.setItem('wms',JSON.stringify(db))}catch(e){alert('Gagal menyimpan. Penyimpanan perangkat penuh atau diblokir.')}});return true}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const fmtT=d=>new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const days=d=>d?Math.ceil((new Date(d)-new Date(today()))/864e5):null;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function edTag(b){const n=days(b.exp);if(n===null)return'';if(n<0)return'<span class="tag bad">Kedaluwarsa</span>';if(n<=30)return`<span class="tag warn">ED ${n} hari</span>`;return''}
function docTags(b){return(b.coa?'<span class="tag ok">COA</span>':'<span class="tag mut">Tanpa COA</span>')+(b.halal?'<span class="tag ok">Halal</span>':'')+(b.nkv?'<span class="tag ok">NKV</span>':'')}

function readFile(f,cb){
  if(!f)return;
  if(f.type.startsWith('image/')){
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.72),'img')};im.src=r.result};r.readAsDataURL(f)
  }else if(f.type==='application/pdf'){
    if(f.size>700*1024){alert('PDF maksimal 700 KB. Kompres dulu atau foto dokumennya.');return}
    const r=new FileReader();r.onload=()=>cb(r.result,'pdf');r.readAsDataURL(f)
  }else alert('Gunakan file foto atau PDF.')
}
function pick(el,key){
  readFile(el.files[0],(d,t)=>{pend[key]={d,t};
    const L=el.parentElement;L.classList.add('has');L.querySelector('span').textContent=(t==='pdf'?'PDF dipilih: ':'Foto dipilih: ')+el.files[0].name;
    const p=L.nextElementSibling;if(p&&p.classList.contains('prev')){if(t==='img'){p.src=d;p.style.display='block'}else p.style.display='none'}
  })
}
function upl(id,key,label,cap,accept){return`<label class="up"><span>${label}</span><input type="file" id="${id}" accept="${accept}" ${cap?'capture="environment"':''} onchange="pick(this,'${key}')"></label><img class="prev" style="display:none" alt="">`}
function docView(t,x){if(!x)return'';return`<h2>${t}</h2>`+(x.t==='img'?`<img class="prev" src="${x.d}" alt="${t}">`:`<iframe src="${x.d}" title="${t}"></iframe>`)}

function render(){
  pend={};
  $('#nav').innerHTML=[['stok','Stok'],['in','Masuk'],['out','Keluar'],['load','Loading'],['log','Riwayat']].map(([k,l])=>`<button ${tab===k?'aria-current="true"':''} onclick="tab='${k}';q='';render();scrollTo(0,0)">${l}</button>`).join('');
  $('#app').innerHTML=roleBar()+{stok:vStok,in:vIn,out:vOut,load:vLoad,log:vLog}[tab]();
}
function vStok(){
  const a=db.batches,tot=a.reduce((s,b)=>s+b.stock,0),exp=a.filter(b=>b.stock>0&&days(b.exp)!==null&&days(b.exp)<=30).length;
  const list=a.filter(b=>(b.name+b.batch+b.sku+(b.loc||'')).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>(x.stock===0)-(y.stock===0)||(x.exp||'9').localeCompare(y.exp||'9'));
  return`<h1>Stok gudang</h1><div class="stats"><div><b>${a.filter(b=>b.stock>0).length}</b><span>Batch aktif</span></div><div><b>${tot}</b><span>Total unit</span></div><div><b class="${exp?'warn':''}">${exp}</b><span>ED ≤ 30 hari</span></div></div>
  <input type="search" placeholder="Cari nama, SKU, batch, rak" value="${esc(q)}" oninput="q=this.value;$('#lst').innerHTML=lst()" aria-label="Cari"><div id="lst" style="margin-top:10px">${lst()}</div>`
}
function lst(){
  const list=db.batches.filter(b=>(b.name+b.batch+b.sku+(b.loc||'')+(b.seal||'')+(b.rph||'')).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>(x.stock===0)-(y.stock===0)||(x.exp||'9').localeCompare(y.exp||'9'));
  if(!db.batches.length)return'<div class="card mut">Belum ada stok. Buka tab Masuk untuk mencatat barang pertama.</div>';
  if(!list.length)return'<div class="card mut">Tidak ada hasil.</div>';
  return list.map(b=>`<div class="card item" onclick="detail('${b.id}')"><div><b>${esc(b.name)}</b><br><small>Batch ${esc(b.batch)}${b.loc?' · Rak '+esc(b.loc):''}<br>ED ${fmt(b.exp)}</small><div style="margin-top:4px">${edTag(b)}${docTags(b)}</div></div><div class="qty ${b.stock===0?'mut':''}">${b.stock}<br><small>${esc(b.unit)}</small></div></div>`).join('')
}
function detail(id){
  const b=db.batches.find(x=>x.id===id);if(!b)return;
  const mv=db.moves.filter(m=>m.bid===id).reverse().map(m=>`<div class="mut">${fmtT(m.date)} · ${m.type==='in'?'Masuk':'Keluar'} ${m.qty} ${esc(b.unit)}${m.party?' · '+esc(m.party):''}</div>`).join('');
  $('#sheet').innerHTML=`<h1>${esc(b.name)}</h1><div class="card">SKU: ${esc(b.sku||'-')}<br>Batch: ${esc(b.batch)}<br>Supplier: ${esc(b.supplier||'-')}<br>No. surat jalan: ${esc(b.sjNo||'-')}<br>Produksi: ${fmt(b.mfg)} · ED: ${fmt(b.exp)}<br>Rak: ${esc(b.loc||'-')}<br>Stok: <b>${b.stock}</b> dari ${b.qty} ${esc(b.unit)}<br>No. sertifikat halal: ${esc(b.halalNo||'-')}<br>Kode rumah potong: ${esc(b.rph||'-')}<br>Suhu terima: ${b.temp?esc(b.temp)+' °C':'-'}<br>Kode segel: ${esc(b.seal||'-')}<br>No. NKV: ${esc(b.nkvNo||'-')}</div>
  ${docView('Foto kode batch',b.photo)}${docView('Foto surat jalan',b.sj)}${docView('COA',b.coa)}${docView('Sertifikat halal',b.halal)}${docView('Sertifikat NKV',b.nkv)}<h2>Pergerakan</h2>${mv}<button class="btn ghost" onclick="closeM()">Tutup</button>`;
  $('#modal').classList.add('on');
}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

function vIn(){return`<h1>Barang masuk</h1><div class="card">
<label>Nama barang</label><input id="n" autocomplete="off">
<div class="row"><div><label>SKU <small>(opsional)</small></label><input id="sku"></div><div><label>Satuan</label><input id="u" value="pcs"></div></div>
<label>Supplier</label><input id="sup">
<div class="row"><div><label>No. batch</label><input id="bt"></div><div><label>Jumlah</label><input id="qt" type="number" inputmode="decimal" min="0"></div></div>
<div class="row"><div><label>Tgl produksi <small>(opsional)</small></label><input id="mfg" type="date"></div><div><label>Tgl kedaluwarsa</label><input id="exp" type="date"></div></div>
<label>Lokasi rak <small>(opsional)</small></label><input id="loc">
<label>Foto kode batch</label>${upl('fp','photo','Ketuk untuk ambil foto kode batch',true,'image/*')}
<label>Foto surat jalan</label>${upl('fj','sj','Ketuk untuk ambil foto surat jalan',true,'image/*')}
<label>No. surat jalan <small>(opsional)</small></label><input id="sjn">
<label>COA <small>(foto atau PDF, opsional)</small></label>${upl('fc','coa','Unggah COA',false,'image/*,application/pdf')}
<label>Sertifikat halal <small>(opsional)</small></label>${upl('fh','halal','Unggah sertifikat halal',false,'image/*,application/pdf')}
<label>No. sertifikat halal <small>(opsional)</small></label><input id="hn">
<label>Kode rumah potong <small>(opsional)</small></label><input id="rph">
<div class="row"><div><label>Suhu terima °C <small>(opsional)</small></label><input id="tmp" type="number" inputmode="decimal" step="0.1"></div><div><label>Kode segel <small>(opsional)</small></label><input id="sg"></div></div>
<label>Sertifikat NKV <small>(opsional)</small></label>${upl('fn','nkv','Unggah sertifikat NKV',false,'image/*,application/pdf')}
<label>No. NKV <small>(opsional)</small></label><input id="nk">
<button class="btn" onclick="subIn()">Simpan barang masuk</button></div>`}
function subIn(){
  const v=i=>$('#'+i).value.trim(),qty=parseFloat(v('qt'));
  if(!v('n'))return alert('Nama barang wajib diisi.');
  if(!v('bt'))return alert('No. batch wajib diisi.');
  if(!(qty>0))return alert('Jumlah harus lebih dari 0.');
  if(!pend.photo)return alert('Foto kode batch wajib diunggah.');
  if(!pend.sj)return alert('Foto surat jalan wajib diunggah.');
  const id='b'+Date.now(),now=new Date().toISOString();
  db.batches.push({id,name:v('n'),sku:v('sku'),unit:v('u')||'pcs',supplier:v('sup'),batch:v('bt'),qty,stock:qty,mfg:v('mfg'),exp:v('exp'),loc:v('loc'),halalNo:v('hn'),rph:v('rph'),temp:v('tmp'),seal:v('sg'),nkvNo:v('nk'),nkv:pend.nkv||null,photo:pend.photo,sj:pend.sj,sjNo:v('sjn'),coa:pend.coa||null,halal:pend.halal||null,date:now});
  db.moves.push({id:'m'+Date.now(),type:'in',bid:id,name:v('n'),batch:v('bt'),qty,unit:v('u')||'pcs',party:v('sup'),doc:v('sjn'),date:now});
  if(!save()){db.batches.pop();db.moves.pop();return}
  toast('Barang masuk tersimpan');tab='stok';render();
}

function avail(){return db.batches.filter(b=>b.stock>0).sort((x,y)=>(x.exp||'9').localeCompare(y.exp||'9'))}
function vOut(){
  const a=avail();
  if(!a.length)return'<h1>Barang keluar</h1><div class="card mut">Belum ada stok yang bisa dikeluarkan.</div>';
  return`<h1>Barang keluar</h1><div class="card"><label>Pilih batch <small>(urut ED terdekat)</small></label>
<select id="ob" onchange="obInfo()">${a.map(b=>`<option value="${b.id}">${esc(b.name)} · ${esc(b.batch)} · sisa ${b.stock} ${esc(b.unit)}</option>`).join('')}</select><div id="oi" class="mut" style="margin-top:6px"></div>
<label>Jumlah keluar</label><input id="oq" type="number" inputmode="decimal" min="0">
<label>Tujuan atau customer</label><input id="op">
<label>No. surat jalan <small>(opsional)</small></label><input id="od">
<button class="btn out" onclick="subOut()">Simpan barang keluar</button></div>`
}
function obInfo(){const b=db.batches.find(x=>x.id===$('#ob').value);if(b)$('#oi').innerHTML=`Stok ${b.stock} ${esc(b.unit)} · ED ${fmt(b.exp)} ${edTag(b)}`}
function subOut(){
  const b=db.batches.find(x=>x.id===$('#ob').value),qty=parseFloat($('#oq').value);
  if(!(qty>0))return alert('Jumlah harus lebih dari 0.');
  if(qty>b.stock)return alert(`Stok tidak cukup. Sisa ${b.stock} ${b.unit}.`);
  if(!$('#op').value.trim())return alert('Tujuan wajib diisi.');
  const first=avail().find(x=>x.name===b.name&&x.id!==b.id&&x.exp&&b.exp&&x.exp<b.exp);
  if(first&&!confirm(`Batch ${first.batch} untuk barang yang sama punya ED lebih dekat (${fmt(first.exp)}). Tetap keluarkan batch ini?`))return;
  if(days(b.exp)!==null&&days(b.exp)<0&&!confirm('Batch ini sudah kedaluwarsa. Tetap keluarkan?'))return;
  b.stock-=qty;const now=new Date().toISOString();
  db.moves.push({id:'m'+Date.now(),type:'out',bid:b.id,name:b.name,batch:b.batch,qty,unit:b.unit,party:$('#op').value.trim(),doc:$('#od').value.trim(),date:now});
  if(!save()){b.stock+=qty;db.moves.pop();return}
  toast('Barang keluar tersimpan');tab='stok';render();
}

function vLog(){
  const m=db.moves.slice().reverse();
  return`<h1>Riwayat</h1>${m.length?m.map(x=>`<div class="card mv ${x.type==='out'?'o':''}"><b>${x.type==='in'?'Masuk':'Keluar'} · ${esc(x.name)}</b><br>Batch ${esc(x.batch)} · ${x.qty} ${esc(x.unit)}<br><small class="mut">${fmtT(x.date)}${x.party?' · '+esc(x.party):''}${x.doc?' · SJ '+esc(x.doc):''}</small></div>`).join(''):'<div class="card mut">Belum ada transaksi.</div>'}
  ${role==='superadmin'?`<button class="btn ghost" onclick="if(confirm('Hapus semua data gudang di perangkat ini?')){db={batches:[],moves:[],loads:[],vtypes:db.vtypes,pins:db.pins};save();render()}">Hapus semua data</button>`:''}`
}
const RL={petugas:'Petugas',admin:'Admin',superadmin:'Super Admin'};
function roleBar(){return`<div class="rb"><span>Masuk sebagai <b>${RL[role]}</b></span><button onclick="switchRole()">Ganti peran</button></div>`}
function switchRole(){$('#sheet').innerHTML=`<h1>Ganti peran</h1><label>Peran</label><select id="rl"><option value="petugas">Petugas</option><option value="admin">Admin</option><option value="superadmin">Super Admin</option></select><label>PIN <small>(untuk Admin dan Super Admin)</small></label><input id="rp" type="password" inputmode="numeric"><button class="btn" onclick="doRole()">Masuk</button><button class="btn ghost" onclick="closeM()">Batal</button>`;$('#modal').classList.add('on')}
function doRole(){const k=$('#rl').value;if(k!=='petugas'&&$('#rp').value!==db.pins[k])return alert('PIN salah.');role=k;closeM();render()}
function vLoad(){
  const ls=db.loads.slice().reverse();
  return`<h1>Loading mobil</h1><div class="card">
<label>Plat nomor kendaraan</label><input id="pl" autocapitalize="characters" autocomplete="off" placeholder="B 1234 XYZ">
<label>Jenis kendaraan</label><select id="vt">${db.vtypes.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
<div class="row"><div><label>Suhu chiller °C <small>(opsional)</small></label><input id="ct" type="number" inputmode="decimal" step="0.1"></div><div><label>No. KIR <small>(opsional)</small></label><input id="kn"></div></div>
<label>Buku KIR <small>(opsional)</small></label>${upl('fk','kir','Unggah buku KIR',false,'image/*,application/pdf')}
<h2>Cek kendaraan berhenti</h2>
<label>Foto hand rem</label>${upl('fr','rem','Ketuk untuk ambil foto hand rem',true,'image/*')}
<label>Foto ganjalan roda</label>${upl('fg','ganjal','Ketuk untuk ambil foto ganjalan',true,'image/*')}
<label>Foto segitiga pengaman</label>${upl('fs','segitiga','Ketuk untuk ambil foto segitiga',true,'image/*')}
<h2>Safety</h2>
<label>Foto safety anggota loading <small>(opsional)</small></label>${upl('fa','safety','Ketuk untuk ambil foto anggota loading',true,'image/*')}
<label>No. surat jalan atau catatan <small>(opsional)</small></label><input id="ln">
<button class="btn" onclick="subLoad()">Simpan loading</button></div>
${role!=='petugas'?vtAdmin():''}
<h2>Riwayat loading</h2>${ls.length?ls.map(l=>`<div class="card item" onclick="loadDetail('${l.id}')"><div><b>${esc(l.plat)}</b><br><small>${esc(l.type)}${l.temp?' · '+esc(l.temp)+' °C':''}<br>${fmtT(l.date)}</small></div><div><span class="tag ok">Rem</span><span class="tag ok">Ganjal</span><span class="tag ok">Segitiga</span>${l.safety?'<span class="tag ok">Safety</span>':''}</div></div>`).join(''):'<div class="card mut">Belum ada loading.</div>'}`
}
function subLoad(){
  const v=i=>$('#'+i).value.trim(),plat=v('pl').toUpperCase();
  if(!plat)return alert('Plat nomor wajib diisi.');
  if(!v('vt'))return alert('Belum ada jenis kendaraan. Minta Admin menambahkannya.');
  if(!pend.rem)return alert('Foto hand rem wajib diunggah.');
  if(!pend.ganjal)return alert('Foto ganjalan roda wajib diunggah.');
  if(!pend.segitiga)return alert('Foto segitiga pengaman wajib diunggah.');
  db.loads.push({id:'l'+Date.now(),plat,type:v('vt'),temp:v('ct'),kirNo:v('kn'),kir:pend.kir||null,rem:pend.rem,ganjal:pend.ganjal,segitiga:pend.segitiga,safety:pend.safety||null,note:v('ln'),date:new Date().toISOString()});
  save();toast('Loading tersimpan');render();
}
function loadDetail(id){
  const l=db.loads.find(x=>x.id===id);if(!l)return;
  $('#sheet').innerHTML=`<h1>${esc(l.plat)}</h1><div class="card">Jenis: ${esc(l.type)}<br>Waktu: ${fmtT(l.date)}<br>Suhu chiller: ${l.temp?esc(l.temp)+' °C':'-'}<br>No. KIR: ${esc(l.kirNo||'-')}<br>Catatan: ${esc(l.note||'-')}</div>${docView('Buku KIR',l.kir)}${docView('Hand rem',l.rem)}${docView('Ganjalan roda',l.ganjal)}${docView('Segitiga pengaman',l.segitiga)}${docView('Safety anggota loading',l.safety)}<button class="btn ghost" onclick="closeM()">Tutup</button>`;
  $('#modal').classList.add('on');
}
function vtAdmin(){return`<div class="card"><b>Kelola jenis kendaraan</b>${db.vtypes.map((t,i)=>`<div class="item" style="margin-top:8px;align-items:center;cursor:default"><span>${esc(t)}</span><span><button class="btn ghost sm" onclick="vtEdit(${i})">Ubah</button> <button class="btn ghost sm" onclick="vtDel(${i})">Hapus</button></span></div>`).join('')}<div class="row" style="margin-top:12px"><input id="nvt" placeholder="Jenis baru"><button class="btn sm" onclick="vtAdd()">Tambah</button></div>${role==='superadmin'?'<button class="btn ghost" onclick="pinForm()">Ubah PIN</button>':''}</div>`}
function vtAdd(){if(role==='petugas')return;const n=$('#nvt').value.trim();if(!n)return alert('Isi nama jenis kendaraan.');if(db.vtypes.some(t=>t.toLowerCase()===n.toLowerCase()))return alert('Jenis kendaraan sudah ada.');db.vtypes.push(n);save();render()}
function vtEdit(i){if(role==='petugas')return;const n=(prompt('Ubah nama jenis kendaraan',db.vtypes[i])||'').trim();if(!n)return;db.vtypes[i]=n;save();render()}
function vtDel(i){if(role==='petugas')return;if(confirm('Hapus jenis "'+db.vtypes[i]+'"? Data loading lama tidak berubah.')){db.vtypes.splice(i,1);save();render()}}
function pinForm(){if(role!=='superadmin')return;const a=prompt('PIN baru Admin (4 sampai 8 angka)',db.pins.admin);if(a&&/^\d{4,8}$/.test(a))db.pins.admin=a;const s=prompt('PIN baru Super Admin (4 sampai 8 angka)',db.pins.superadmin);if(s&&/^\d{4,8}$/.test(s))db.pins.superadmin=s;save();toast('PIN diperbarui')}
(async()=>{let d=null;try{d=await IDB.get()}catch(e){}
if(!d)try{d=JSON.parse(localStorage.getItem('wms')||'null')}catch(e){}
if(d&&d.batches)db=d;defaults();render()})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
