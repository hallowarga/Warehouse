<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f9afe">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gudang Masuk Keluar</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--tx:#1d2a26;--mut:#68736f;--pri:#0f6b5a;--ptx:#fff;--bd:#dcd8cf;--ok:#1d7a46;--warn:#a86400;--bad:#b3261e;--in:#e1f1ea;--out:#fbe6e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a18;--card:#1b2623;--tx:#e8efec;--mut:#98a6a1;--pri:#3fbf9f;--ptx:#08201a;--bd:#2c3b37;--ok:#5fd08d;--warn:#e3a33b;--bad:#ff8a80;--in:#1c3a31;--out:#442522;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a18;--card:#1b2623;--tx:#e8efec;--mut:#98a6a1;--pri:#3fbf9f;--ptx:#08201a;--bd:#2c3b37;--ok:#5fd08d;--warn:#e3a33b;--bad:#ff8a80;--in:#1c3a31;--out:#442522;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:4px 0 14px}
h2{font:700 16px Georgia,serif;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.stats b{display:block;font-size:22px}.stats span{color:var(--mut);font-size:12px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
label small{font-weight:400;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--pri);color:var(--ptx);font:700 15px inherit;cursor:pointer}
.btn.out{background:var(--bad);color:#fff}.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mut);font:600 12px inherit;cursor:pointer}
nav button[aria-current=true]{color:var(--pri);box-shadow:inset 0 3px var(--pri)}
.item{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.item small,.mut{color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;border:1px solid currentColor;margin-right:4px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.qty{text-align:right;font-weight:700;white-space:nowrap}
.mv{border-left:4px solid var(--ok);background:var(--in)}.mv.o{border-left-color:var(--bad);background:var(--out)}
.prev{margin-top:8px;max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--bd)}
.up{display:block;padding:12px;border:2px dashed var(--bd);border-radius:10px;text-align:center;color:var(--mut);cursor:pointer;margin:0}
.up.has{border-style:solid;border-color:var(--ok);color:var(--ok)}
.up input{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:9}
#modal.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;margin:0 auto;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:600;display:none;z-index:10}
iframe{width:100%;height:280px;border:1px solid var(--bd);border-radius:8px;margin-top:8px}
.rb{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mut)}
.rb button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 12px;font-weight:600;font-size:12px;cursor:pointer}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"><div id="sheet"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const SB=supabase.createClient('https://qtylzivpxlqpmfkaogoj.supabase.co','sb_publishable_L17-GlhLmYOjIZGrbf8Vgg_lJaU-O4v');
const $=s=>document.querySelector(s);
let me=null,tab='stok',q='',pend={},busy=false,D={batches:[],moves:[],loads:[],vtypes:[],staff:[]};
const RL={petugas:'Petugas',admin:'Admin',superadmin:'Super Admin',security:'Security'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const fmtT=d=>new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const days=d=>d?Math.ceil((new Date(d)-new Date(today()))/864e5):null;
const nn=v=>v===''||v==null?null:v;
const nm=id=>(D.staff.find(s=>s.id===id)||{}).name||'-';
const adm=()=>me.role==='admin'||me.role==='superadmin';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function edTag(b){const n=days(b.exp);if(n===null)return'';if(n<0)return'<span class="tag bad">Kedaluwarsa</span>';if(n<=30)return`<span class="tag warn">ED ${n} hari</span>`;return''}
function docTags(b){return(b.coa?'<span class="tag ok">COA</span>':'<span class="tag mut">Tanpa COA</span>')+(b.halal?'<span class="tag ok">Halal</span>':'')+(b.nkv?'<span class="tag ok">NKV</span>':'')}
async function run(btn,fn){if(busy)return;busy=true;btn.disabled=true;const t=btn.textContent;btn.textContent='Menyimpan…';try{await fn()}catch(e){alert('Gagal: '+(e.message||e))}busy=false;btn.disabled=false;btn.textContent=t}

/* file */
function readFile(f,cb){if(!f)return;
  if(f.type.startsWith('image/')){const im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>cb(b,'img'),'image/jpeg',.75)};im.src=URL.createObjectURL(f)}
  else if(f.type==='application/pdf'){if(f.size>3e6)return alert('PDF maksimal 3 MB.');cb(f,'pdf')}
  else alert('Gunakan file foto atau PDF.')}
function pick(el,key){const f=el.files[0];readFile(f,(b,t)=>{pend[key]={b,t};const L=el.parentElement;L.classList.add('has');L.querySelector('span').textContent=(t==='pdf'?'PDF dipilih: ':'Foto dipilih: ')+f.name;const p=L.nextElementSibling;if(p&&p.classList.contains('prev')){if(t==='img'){p.src=URL.createObjectURL(b);p.style.display='block'}else p.style.display='none'}})}
function upl(id,key,label,cap,accept){return`<label class="up"><span>${label}</span><input type="file" id="${id}" accept="${accept}" ${cap?'capture="environment"':''} onchange="pick(this,'${key}')"></label><img class="prev" style="display:none" alt="">`}
async function up(key,dir){const x=pend[key];if(!x)return null;const p=`${dir?dir+'/':''}${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${x.t==='pdf'?'pdf':'jpg'}`;const{error}=await SB.storage.from('docs').upload(p,x.b,{contentType:x.t==='pdf'?'application/pdf':'image/jpeg'});if(error)throw error;return p}
async function sign(a){a=a.filter(Boolean);const m={};if(!a.length)return m;const{data}=await SB.storage.from('docs').createSignedUrls(a,3600);(data||[]).forEach(d=>{if(d.signedUrl)m[d.path]=d.signedUrl});return m}
function dv(t,p,m){if(!p||!m[p])return'';return`<h2>${t}</h2>`+(p.endsWith('.pdf')?`<iframe src="${m[p]}" title="${t}"></iframe>`:`<img class="prev" src="${m[p]}" alt="${t}">`)}

/* data */
async function refresh(){
  const r=await Promise.all([SB.from('batches').select('*').order('created_at',{ascending:false}).limit(1000),SB.from('moves').select('*,batches(name,batch_no,unit)').order('created_at',{ascending:false}).limit(200),SB.from('loads').select('*').order('created_at',{ascending:false}).limit(100),SB.from('vehicle_types').select('*').order('name'),SB.from('profiles').select('*').order('name')]);
  const e=r.find(x=>x.error);if(e){alert('Gagal memuat data: '+e.error.message);return}
  [D.batches,D.moves,D.loads,D.vtypes,D.staff]=r.map(x=>x.data)}

/* shell */
function roleBar(){return`<div class="rb"><span>Masuk sebagai <b>${esc(me.name)}</b> (${RL[me.role]})</span><button onclick="logout()">Keluar</button></div>`}
function render(){pend={};
  $('#nav').innerHTML=(me.role==='security'?[['load','Loading']]:[['stok','Stok'],['in','Masuk'],['out','Keluar'],['load','Loading'],['log','Riwayat']]).map(([k,l])=>`<button ${tab===k?'aria-current="true"':''} onclick="go('${k}')">${l}</button>`).join('');
  $('#app').innerHTML=roleBar()+{stok:vStok,in:vIn,out:vOut,load:vLoad,log:vLog}[tab]()}
async function go(t){tab=t;q='';$('#app').innerHTML=roleBar()+'<div class="card mut">Memuat…</div>';await refresh();render();scrollTo(0,0)}
function vLogin(){$('#nav').innerHTML='';$('#app').innerHTML=`<h1>Gudang</h1><div class="card"><label>Nama</label><input id="lgn" autocapitalize="none" autocomplete="username"><label>PIN</label><input id="lgp" type="password" inputmode="numeric" autocomplete="current-password"><button class="btn" onclick="run(this,doLogin)">Masuk</button></div>`}
async function doLogin(){const n=$('#lgn').value.trim().toLowerCase().replace(/\s/g,''),p=$('#lgp').value;if(!n||!p)return alert('Isi nama dan PIN.');
  const{error}=await SB.auth.signInWithPassword({email:n+'@gudang.app',password:p});if(error){const m=error.message||'';return alert(/Invalid login/i.test(m)?'Nama atau PIN salah. Cek di Supabase: email harus persis '+n+'@gudang.app dan password 6 angka.':/not confirmed/i.test(m)?'Akun belum dikonfirmasi. Buat ulang dengan Auto Confirm User.':'Login gagal: '+m)}await boot()}
async function boot(){const{data:{session}}=await SB.auth.getSession();if(!session)return vLogin();
  const{data:p,error}=await SB.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!p||!p.active){await SB.auth.signOut();vLogin();return alert(error?'Gagal membaca profil: '+error.message:'Profil akun belum ada atau akun nonaktif. Jalankan SQL perbaikan profil di Supabase.')}
  me=p;go(p.role==='security'?'load':'stok')}
function logout(){SB.auth.signOut().then(()=>{me=null;vLogin()})}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

/* stok */
function vStok(){const a=D.batches,exp=a.filter(b=>b.stock>0&&days(b.exp)!==null&&days(b.exp)<=30).length;
  return`<h1>Stok gudang</h1><div class="stats"><div><b>${a.filter(b=>b.stock>0).length}</b><span>Batch aktif</span></div><div><b>${a.reduce((s,b)=>s+b.stock,0)}</b><span>Total unit</span></div><div><b class="${exp?'warn':''}">${exp}</b><span>ED ≤ 30 hari</span></div></div>
  <input type="search" placeholder="Cari nama, SKU, batch, rak, segel" value="${esc(q)}" oninput="q=this.value;$('#lst').innerHTML=lst()" aria-label="Cari"><div id="lst" style="margin-top:10px">${lst()}</div>`}
function lst(){const t=q.toLowerCase(),l=D.batches.filter(b=>[b.name,b.batch_no,b.sku,b.loc,b.seal,b.rph].join(' ').toLowerCase().includes(t)).sort((x,y)=>(x.stock===0)-(y.stock===0)||(x.exp||'9').localeCompare(y.exp||'9'));
  if(!D.batches.length)return'<div class="card mut">Belum ada stok. Buka tab Masuk untuk mencatat barang pertama.</div>';
  if(!l.length)return'<div class="card mut">Tidak ada hasil.</div>';
  return l.map(b=>`<div class="card item" onclick="detail('${b.id}')"><div><b>${esc(b.name)}</b><br><small>Batch ${esc(b.batch_no)}${b.loc?' · Rak '+esc(b.loc):''}<br>ED ${fmt(b.exp)}</small><div style="margin-top:4px">${edTag(b)}${docTags(b)}</div></div><div class="qty ${b.stock===0?'mut':''}">${b.stock}<br><small>${esc(b.unit)}</small></div></div>`).join('')}
async function detail(id){const b=D.batches.find(x=>x.id===id);if(!b)return;
  $('#sheet').innerHTML='<div class="mut">Memuat…</div>';$('#modal').classList.add('on');
  const m=await sign([b.photo_batch,b.photo_sj,b.coa,b.halal,b.nkv]);
  const mv=D.moves.filter(x=>x.batch_id===id).map(x=>`<div class="mut">${fmtT(x.created_at)} · ${x.type==='in'?'Masuk':'Keluar'} ${x.qty} ${esc(b.unit)}${x.party?' · '+esc(x.party):''} · ${esc(nm(x.created_by))}</div>`).join('');
  $('#sheet').innerHTML=`<h1>${esc(b.name)}</h1><div class="card">SKU: ${esc(b.sku||'-')}<br>Batch: ${esc(b.batch_no)}<br>Supplier: ${esc(b.supplier||'-')}<br>No. surat jalan: ${esc(b.sj_no||'-')}<br>Produksi: ${fmt(b.mfg)} · ED: ${fmt(b.exp)}<br>Rak: ${esc(b.loc||'-')}<br>Stok: <b>${b.stock}</b> dari ${b.qty} ${esc(b.unit)}<br>No. sertifikat halal: ${esc(b.halal_no||'-')}<br>Kode rumah potong: ${esc(b.rph||'-')}<br>Suhu terima: ${b.temp!=null?esc(b.temp)+' °C':'-'}<br>Kode segel: ${esc(b.seal||'-')}<br>No. NKV: ${esc(b.nkv_no||'-')}<br>Dicatat oleh: ${esc(nm(b.created_by))}</div>
  ${dv('Foto kode batch',b.photo_batch,m)}${dv('Foto surat jalan',b.photo_sj,m)}${dv('COA',b.coa,m)}${dv('Sertifikat halal',b.halal,m)}${dv('Sertifikat NKV',b.nkv,m)}<h2>Pergerakan</h2>${mv}<button class="btn ghost" onclick="closeM()">Tutup</button>`}

/* masuk */
function vIn(){return`<h1>Barang masuk</h1><div class="card">
<label>Nama barang</label><input id="n" autocomplete="off">
<div class="row"><div><label>SKU <small>(opsional)</small></label><input id="sku"></div><div><label>Satuan</label><input id="u" value="pcs"></div></div>
<label>Supplier</label><input id="sup">
<div class="row"><div><label>No. batch</label><input id="bt"></div><div><label>Jumlah</label><input id="qt" type="number" inputmode="decimal" min="0"></div></div>
<div class="row"><div><label>Tgl produksi <small>(opsional)</small></label><input id="mfg" type="date"></div><div><label>Tgl kedaluwarsa</label><input id="exp" type="date"></div></div>
<label>Lokasi rak <small>(opsional)</small></label><input id="loc">
<label>Foto kode batch</label>${upl('fp','photo','Ketuk untuk ambil foto kode batch',true,'image/*')}
<label>Foto surat jalan</label>${upl('fj','sj','Ketuk untuk ambil foto surat jalan',true,'image/*')}
<label>No. surat jalan <small>(opsional)</small></label><input id="sjn">
<label>COA <small>(foto atau PDF, opsional)</small></label>${upl('fc','coa','Unggah COA',false,'image/*,application/pdf')}
<label>Sertifikat halal <small>(opsional)</small></label>${upl('fh','halal','Unggah sertifikat halal',false,'image/*,application/pdf')}
<label>No. sertifikat halal <small>(opsional)</small></label><input id="hn">
<label>Kode rumah potong <small>(opsional)</small></label><input id="rph">
<div class="row"><div><label>Suhu terima °C <small>(opsional)</small></label><input id="tmp" type="number" inputmode="decimal" step="0.1"></div><div><label>Kode segel <small>(opsional)</small></label><input id="sg"></div></div>
<label>Sertifikat NKV <small>(opsional)</small></label>${upl('fn','nkv','Unggah sertifikat NKV',false,'image/*,application/pdf')}
<label>No. NKV <small>(opsional)</small></label><input id="nk">
<button class="btn" onclick="run(this,subIn)">Simpan barang masuk</button></div>`}
async function subIn(){const v=i=>$('#'+i).value.trim(),qty=parseFloat(v('qt'));
  if(!v('n'))return alert('Nama barang wajib diisi.');if(!v('bt'))return alert('No. batch wajib diisi.');if(!(qty>0))return alert('Jumlah harus lebih dari 0.');
  if(!pend.photo)return alert('Foto kode batch wajib diunggah.');if(!pend.sj)return alert('Foto surat jalan wajib diunggah.');
  const[pb,ps,pc,ph,pn]=await Promise.all(['photo','sj','coa','halal','nkv'].map(k=>up(k)));
  const{error}=await SB.from('batches').insert({name:v('n'),sku:nn(v('sku')),unit:v('u')||'pcs',supplier:nn(v('sup')),batch_no:v('bt'),qty,mfg:nn(v('mfg')),exp:nn(v('exp')),loc:nn(v('loc')),halal_no:nn(v('hn')),rph:nn(v('rph')),temp:nn(v('tmp')),seal:nn(v('sg')),nkv_no:nn(v('nk')),sj_no:nn(v('sjn')),photo_batch:pb,photo_sj:ps,coa:pc,halal:ph,nkv:pn});
  if(error)throw error;toast('Barang masuk tersimpan');await go('stok')}

/* keluar */
const avail=()=>D.batches.filter(b=>b.stock>0).sort((x,y)=>(x.exp||'9').localeCompare(y.exp||'9'));
function vOut(){const a=avail();if(!a.length)return'<h1>Barang keluar</h1><div class="card mut">Belum ada stok yang bisa dikeluarkan.</div>';
  return`<h1>Barang keluar</h1><div class="card"><label>Pilih batch <small>(urut ED terdekat)</small></label>
<select id="ob" onchange="obInfo()">${a.map(b=>`<option value="${b.id}">${esc(b.name)} · ${esc(b.batch_no)} · sisa ${b.stock} ${esc(b.unit)}</option>`).join('')}</select><div id="oi" class="mut" style="margin-top:6px"></div>
<label>Jumlah keluar</label><input id="oq" type="number" inputmode="decimal" min="0">
<label>Tujuan atau customer</label><input id="op">
<label>No. surat jalan <small>(opsional)</small></label><input id="od">
<button class="btn out" onclick="run(this,subOut)">Simpan barang keluar</button></div>`}
function obInfo(){const b=D.batches.find(x=>x.id===$('#ob').value);if(b)$('#oi').innerHTML=`Stok ${b.stock} ${esc(b.unit)} · ED ${fmt(b.exp)} ${edTag(b)}`}
async function subOut(){const b=D.batches.find(x=>x.id===$('#ob').value),qty=parseFloat($('#oq').value);
  if(!(qty>0))return alert('Jumlah harus lebih dari 0.');if(qty>b.stock)return alert(`Stok tidak cukup. Sisa ${b.stock} ${b.unit}.`);if(!$('#op').value.trim())return alert('Tujuan wajib diisi.');
  const f=avail().find(x=>x.name===b.name&&x.id!==b.id&&x.exp&&b.exp&&x.exp<b.exp);
  if(f&&!confirm(`Batch ${f.batch_no} untuk barang yang sama punya ED lebih dekat (${fmt(f.exp)}). Tetap keluarkan batch ini?`))return;
  if(days(b.exp)!==null&&days(b.exp)<0&&!confirm('Batch ini sudah kedaluwarsa. Tetap keluarkan?'))return;
  const{error}=await SB.rpc('do_outbound',{p_batch:b.id,p_qty:qty,p_party:$('#op').value.trim(),p_doc:nn($('#od').value.trim())});
  if(error)throw error;toast('Barang keluar tersimpan');await go('stok')}

/* loading */
function vLoad(){return`<h1>Loading mobil</h1><div class="card">
<label>Plat nomor kendaraan</label><input id="pl" autocapitalize="characters" autocomplete="off" placeholder="B 1234 XYZ">
<label>Jenis kendaraan</label><select id="vt">${D.vtypes.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select>
<div class="row"><div><label>Suhu chiller °C <small>(opsional)</small></label><input id="ct" type="number" inputmode="decimal" step="0.1"></div><div><label>No. KIR <small>(opsional)</small></label><input id="kn"></div></div>
<label>Buku KIR <small>(opsional)</small></label>${upl('fk','kir','Unggah buku KIR',false,'image/*,application/pdf')}
<h2>Cek kendaraan berhenti</h2>
<label>Foto hand rem</label>${upl('fr','rem','Ketuk untuk ambil foto hand rem',true,'image/*')}
<label>Foto ganjalan roda</label>${upl('fg','ganjal','Ketuk untuk ambil foto ganjalan',true,'image/*')}
<label>Foto segitiga pengaman</label>${upl('fs','segitiga','Ketuk untuk ambil foto segitiga',true,'image/*')}
<h2>Safety</h2>
<label>Foto safety anggota loading <small>(opsional)</small></label>${upl('fa','safety','Ketuk untuk ambil foto anggota loading',true,'image/*')}
<label>No. surat jalan atau catatan <small>(opsional)</small></label><input id="ln">
<button class="btn" onclick="run(this,subLoad)">Simpan loading</button></div>
${adm()?vtAdmin():''}
<h2>Riwayat loading</h2>${D.loads.length?D.loads.map(l=>`<div class="card item" onclick="loadDetail('${l.id}')"><div><b>${esc(l.plat)}</b><br><small>${esc(l.vehicle_type)}${l.chiller_temp!=null?' · '+esc(l.chiller_temp)+' °C':''}<br>${fmtT(l.created_at)} · ${esc(nm(l.created_by))}</small></div><div><span class="tag ok">Rem</span><span class="tag ok">Ganjal</span><span class="tag ok">Segitiga</span>${l.safety_file?'<span class="tag ok">Safety</span>':''}</div></div>`).join(''):'<div class="card mut">Belum ada loading.</div>'}`}
async function subLoad(){const v=i=>$('#'+i).value.trim(),plat=v('pl').toUpperCase();
  if(!plat)return alert('Plat nomor wajib diisi.');if(!v('vt'))return alert('Belum ada jenis kendaraan. Minta Admin menambahkannya.');
  if(!pend.rem)return alert('Foto hand rem wajib diunggah.');if(!pend.ganjal)return alert('Foto ganjalan roda wajib diunggah.');if(!pend.segitiga)return alert('Foto segitiga pengaman wajib diunggah.');
  const[k,r,g,s,a]=await Promise.all(['kir','rem','ganjal','segitiga','safety'].map(x=>up(x,'loads')));
  const{error}=await SB.from('loads').insert({plat,vehicle_type:v('vt'),chiller_temp:nn(v('ct')),kir_no:nn(v('kn')),kir_file:k,rem_file:r,ganjal_file:g,segitiga_file:s,safety_file:a,note:nn(v('ln'))});
  if(error)throw error;toast('Loading tersimpan');await go('load')}
async function loadDetail(id){const l=D.loads.find(x=>x.id===id);if(!l)return;
  $('#sheet').innerHTML='<div class="mut">Memuat…</div>';$('#modal').classList.add('on');
  const m=await sign([l.kir_file,l.rem_file,l.ganjal_file,l.segitiga_file,l.safety_file]);
  $('#sheet').innerHTML=`<h1>${esc(l.plat)}</h1><div class="card">Jenis: ${esc(l.vehicle_type)}<br>Waktu: ${fmtT(l.created_at)}<br>Petugas: ${esc(nm(l.created_by))}<br>Suhu chiller: ${l.chiller_temp!=null?esc(l.chiller_temp)+' °C':'-'}<br>No. KIR: ${esc(l.kir_no||'-')}<br>Catatan: ${esc(l.note||'-')}</div>${dv('Buku KIR',l.kir_file,m)}${dv('Hand rem',l.rem_file,m)}${dv('Ganjalan roda',l.ganjal_file,m)}${dv('Segitiga pengaman',l.segitiga_file,m)}${dv('Safety anggota loading',l.safety_file,m)}<button class="btn ghost" onclick="closeM()">Tutup</button>`}
function vtAdmin(){return`<div class="card"><b>Kelola jenis kendaraan</b>${D.vtypes.map(t=>`<div class="item" style="margin-top:8px;align-items:center;cursor:default"><span>${esc(t.name)}</span><span><button class="btn ghost sm" onclick="vtEdit(${t.id})">Ubah</button> <button class="btn ghost sm" onclick="vtDel(${t.id})">Hapus</button></span></div>`).join('')}<div class="row" style="margin-top:12px"><input id="nvt" placeholder="Jenis baru"><button class="btn sm" onclick="vtAdd()">Tambah</button></div></div>`}
async function vtDo(p){const{error}=await p;if(error)alert(error.message);await refresh();render()}
function vtAdd(){const n=$('#nvt').value.trim();if(!n)return alert('Isi nama jenis kendaraan.');vtDo(SB.from('vehicle_types').insert({name:n}))}
function vtEdit(id){const t=D.vtypes.find(x=>x.id===id),n=(prompt('Ubah nama jenis kendaraan',t.name)||'').trim();if(n)vtDo(SB.from('vehicle_types').update({name:n}).eq('id',id))}
function vtDel(id){const t=D.vtypes.find(x=>x.id===id);if(confirm('Hapus jenis "'+t.name+'"? Data loading lama tidak berubah.'))vtDo(SB.from('vehicle_types').delete().eq('id',id))}

/* riwayat */
function vLog(){return`<h1>Riwayat</h1>${D.moves.length?D.moves.map(x=>{const b=x.batches||{};return`<div class="card mv ${x.type==='out'?'o':''}"><b>${x.type==='in'?'Masuk':'Keluar'} · ${esc(b.name||'-')}</b><br>Batch ${esc(b.batch_no||'-')} · ${x.qty} ${esc(b.unit||'')}<br><small class="mut">${fmtT(x.created_at)}${x.party?' · '+esc(x.party):''}${x.doc?' · SJ '+esc(x.doc):''} · ${esc(nm(x.created_by))}</small></div>`}).join(''):'<div class="card mut">Belum ada transaksi.</div>'}${me.role==='superadmin'?vStaff():''}`}
function vStaff(){return`<h2>Kelola petugas</h2><div class="card">${D.staff.map(s=>{const self=s.id===me.id?'disabled':'';return`<div class="item" style="cursor:default;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px"><span>${esc(s.name)}</span><span><select style="width:auto" ${self} onchange="setStaff('${s.id}',{role:this.value})">${['petugas','admin','superadmin','security'].map(r=>`<option value="${r}" ${s.role===r?'selected':''}>${RL[r]}</option>`).join('')}</select> <label style="display:inline"><input type="checkbox" style="width:auto" ${self} ${s.active?'checked':''} onchange="setStaff('${s.id}',{active:this.checked})"> Aktif</label> <button class="btn ghost sm" onclick="resetPin('${s.id}')">Reset PIN</button></span></div>`}).join('')}<h2 style="margin-top:14px">Tambah petugas</h2><label>Nama login <small>(huruf kecil, tanpa spasi)</small></label><input id="sn" autocapitalize="none" autocomplete="off"><div class="row"><div><label>PIN 6 angka</label><input id="sp" inputmode="numeric" maxlength="6"></div><div><label>Peran</label><select id="sr"><option value="petugas">Petugas</option><option value="admin">Admin</option><option value="superadmin">Super Admin</option><option value="security">Security</option></select></div></div><button class="btn" onclick="run(this,addStaff)">Tambah petugas</button></div>`}
async function setStaff(id,p){const{error}=await SB.from('profiles').update(p).eq('id',id);if(error)alert(error.message);await refresh();render()}
async function callFn(body){const{data,error}=await SB.functions.invoke('create-user',{body});if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}return data}
async function addStaff(){const n=$('#sn').value.trim().toLowerCase().replace(/\s/g,''),p=$('#sp').value.trim();if(n.length<2)return alert('Isi nama login.');if(!/^\d{6}$/.test(p))return alert('PIN harus 6 angka.');await callFn({name:n,pin:p,role:$('#sr').value});toast('Petugas '+n+' ditambahkan');await go('log')}
function resetPin(id){const s=D.staff.find(x=>x.id===id),p=prompt('PIN baru untuk '+s.name+' (6 angka)');if(!p)return;if(!/^\d{6}$/.test(p))return alert('PIN harus 6 angka.');callFn({action:'reset',id,pin:p}).then(()=>toast('PIN diperbarui')).catch(e=>alert('Gagal: '+e.message))}
boot();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
